# Builds the PS Vita .vpk on every push. Download it from the run's "Artifacts" section.
name: Vita VPK

on:
  push:
  workflow_dispatch:

jobs:
  vpk:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - name: Tools
        run: apk add --no-cache cmake make git bash python3 || true

      - uses: actions/checkout@v5

      # vitasdk/vitasdk ships every library this needs (vitaGL, vitaShaRK, SceShaccCgExt, taihen,
      # SDL2 as sdl2_vitagl, math-neon), so nothing is installed here. Just log the versions.
      - name: Vita libraries
        run: |
          ls "$VITASDK/arm-vita-eabi/lib" | grep -iE "vitagl|vitashark|shacccg|sdl2|mathneon|taihen" || true

      - name: Build
        run: |
          cmake -S . -B build-vita -DCMAKE_TOOLCHAIN_FILE=$VITASDK/share/vita.toolchain.cmake -DCMAKE_BUILD_TYPE=Release
          cmake --build build-vita -j"$(nproc)"

      - uses: actions/upload-artifact@v4
        with:
          name: BackroomsIris-vpk
          path: |
            build-vita/BackroomsIris.vpk
            build-vita/iris_vita
